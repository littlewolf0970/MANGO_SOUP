<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>횡스크롤 게임 - 모스크바 1998</title>
<style>
  :root { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #25282b; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
  #dev-tools { position: absolute; top: 10px; right: 10px; z-index: 100; font-family: sans-serif; }
  #dev-btn { padding: 6px 12px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-size: 13px; }
  #dev-panel { display: none; margin-top: 4px; background: rgba(20,22,26,.85); padding: 6px; border-radius: 4px; }
  #dev-panel button { display: block; width: 100%; margin: 3px 0; padding: 4px 8px; font-size: 12px; background: #444; color: #fff; border: 1px solid #666; border-radius: 3px; cursor: pointer; text-align: left; }
  #dev-panel button:hover { background: #555; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dev-tools">
  <button id="dev-btn">DEV</button>
  <div id="dev-panel">
    <button id="btn-revive">부활</button>
    <button id="btn-skip-round">라운드 스킵</button>
    <button id="btn-skip-wait">대기 스킵</button>
    <button id="btn-confirm-vote">투표 확정</button>
  </div>
</div>
<script>
(() => {
  const cv = document.getElementById('c');
  const mainCtx = cv.getContext('2d');
  let ctx = mainCtx; // 가구 윤곽 측정 때 잠시 다른 캔버스로 바뀜
  const W = 800, H = 450, GROUND_H = 80, GROUND_Y = H - GROUND_H, G = GROUND_Y;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const s = Math.min(innerWidth / W, innerHeight / H);
    cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
    cv.width = W * s * dpr; cv.height = H * s * dpr;
    mainCtx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  // ---------- 축척: 플레이어 키 48px = 180cm ----------
  const PPM = 48 / 1.8;
  const m = v => Math.round(v * PPM);

  let camX = 0;
  const GRAVITY = 1400, JUMP_V = 300, SPEED = 170;
  const ZOOM = 1.6, CAM_TOP = GROUND_Y - 355 / ZOOM, CAM_LEAD = 175;
  const player = { wx: 120, y: GROUND_Y - 48, w: 18, h: 48, face: 1, vy: 0, onGround: true, hiding: false, exposed: false, side: 1 };
  const mod = (a, n) => ((a % n) + n) % n;
  const hs = (a, b, c) => Math.abs(a * 7 + b * 13 + c * 5);

  // ---------- 그리기 도우미 ----------
  const R = (c, x, y, w, h) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
  const disc = (c, x, y, r) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); };
  const glow = (x, y, r, rgb, a) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${rgb},1)`); g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1;
  };
  const text = (t, x, y, size, col) => { ctx.font = `bold ${size}px sans-serif`; ctx.fillStyle = col; ctx.fillText(t, x, y); };
  const poly = (c, pts) => { ctx.fillStyle = c; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.fill(); };
  const far = f => (x, v) => { ctx.globalAlpha = .8; f(x, v); ctx.globalAlpha = 1; };
  const rep = (P, par, off, fn) => { // 규칙적인 배경 무늬용
    const s = camX * par, k0 = Math.floor((s - off) / P) - 1, k1 = Math.floor((s + W - off) / P) + 1;
    for (let k = k0; k <= k1; k++) fn(k * P + off - s, k);
  };

  // =====================================================
  // 랜덤 배치 엔진
  // 스트림 = 한 줄로 놓이는 오브젝트 열. 정의(def) 중 하나를 가중치로 뽑고,
  // 앞뒤 간격을 랜덤으로 띄워 배치. 같은 종류가 연달아 나오지 않도록 cool 적용.
  // def: { w(폭 또는 함수), draw(x, v), weight, cool }
  // =====================================================
  function fill(s, hi) {
    while (s.cur < hi) {
      let cand = s.defs.map((d, i) => i).filter(i => s.since[i] >= (s.defs[i].cool || 1));
      if (!cand.length) cand = s.defs.map((d, i) => i);
      let r = Math.random() * cand.reduce((a, i) => a + (s.defs[i].weight || 1), 0), idx = cand[cand.length - 1];
      for (const i of cand) { r -= (s.defs[i].weight || 1); if (r <= 0) { idx = i; break; } }
      const d = s.defs[idx], v = Math.floor(Math.random() * 1e6), w = (typeof d.w === 'function' ? d.w(v) : d.w) * (s.scale || 1);
      const x = s.cur + s.gap[0] + Math.random() * (s.gap[1] - s.gap[0]);
      s.items.push({ x, w, v, d, k: s.scale || 1 }); s.cur = x + w;
      s.since = s.since.map(n => n + 1); s.since[idx] = 0;
    }
  }
  // 터널 근처 장식 제거: avoid(여유 px)가 지정된 줄의 아이템은 터널 구조물 주변에서 그리지도, 시야를 막지도 않는다
  function skipItem(s, it) {
    if (s.avoid == null) return false;
    const tz = streams.find(q => q.tunnel);
    return !!tz && tz !== s && tz.items.some(t => it.x < t.x + t.w + s.avoid && it.x + it.w > t.x - s.avoid);
  }
  function drawStream(s) {
    const lo = camX * s.par - 20, hi = camX * s.par + W / ZOOM + 20;
    fill(s, hi + 400);
    if (s.pre) s.pre();
    for (const it of s.items) {
      if (it.x > hi) break;
      if (it.x + it.w < lo) continue;
      if (skipItem(s, it)) continue;
      const k = s.scale || 1, sx = it.x - camX * s.par; // 가구 배율: 바닥(G) 기준으로 확대
      if (k !== 1) { ctx.save(); ctx.translate(sx, G); ctx.scale(k, k); ctx.translate(-sx, -G); }
      it.d.draw(sx, it.v, it.w / k);
      if (k !== 1) ctx.restore();
    }
  }

  // =====================================================
  // 장면 1: 모스크바 거리
  // =====================================================
  function onion(cx, by, w, h, col) {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(cx - w / 2, by);
    ctx.bezierCurveTo(cx - w * .85, by - h * .4, cx - w * .1, by - h * .6, cx, by - h);
    ctx.bezierCurveTo(cx + w * .1, by - h * .6, cx + w * .85, by - h * .4, cx + w / 2, by); ctx.fill();
    R('#c9a24a', cx - 1, by - h - 9, 2, 9);
  }
  const BY = G - 20;
  const skyDefs = [
    { w: 160, weight: 1, cool: 4, draw: far(x => { const o = x + 80;
        R('#9b6e5e', o - 70, BY - 50, 140, 50); R('#b58a73', o - 22, BY - 90, 44, 40);
        onion(o, BY - 90, 40, 70, '#a8403a'); onion(o - 52, BY - 50, 28, 46, '#3f7d5a'); onion(o + 52, BY - 50, 28, 46, '#4a5f9a');
        onion(o - 28, BY - 50, 24, 40, '#c9a24a'); onion(o + 28, BY - 50, 24, 40, '#7a4a8a'); }) },
    { w: 180, weight: 1, cool: 4, draw: far(x => { const k = x + 90;
        R('#8a4a40', k - 90, BY - 36, 180, 36); R('#8a4a40', k - 18, BY - 120, 36, 120);
        poly('#6f8a6a', [[k - 24, BY - 120], [k, BY - 175], [k + 24, BY - 120]]); disc('#c0392b', k, BY - 182, 6); }) },
    { w: 24, weight: 1, cool: 4, draw: far(x => { const t = x + 12;
        poly('#8d9296', [[t - 8, BY], [t - 2, BY - 150], [t + 2, BY - 150], [t + 8, BY]]);
        R('#8d9296', t - 11, BY - 150, 22, 10); R('#8d9296', t - 1, BY - 230, 2, 80); }) },
    { w: 60, weight: 3, cool: 1, draw: far((x, v) => { const h = 140 + v % 120;
        R('#8d9296', x, BY - h, 60, h); for (let i = 0; i < 5; i++) R('rgba(0,0,0,.15)', x + 6 + i * 11, BY - h, 2, h); }) },
    { w: 44, weight: 2, cool: 2, draw: far(x => {
        R('#7d8087', x + 14, BY - 170, 16, 170); for (let i = 0; i < 3; i++) R('#c0392b', x + 14, BY - 170 + i * 20, 16, 8);
        ctx.fillStyle = 'rgba(220,220,220,.6)'; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(x + 30 + i * 12, BY - 180 - i * 14, 14, 8, 0, 0, 7); ctx.fill(); } }) },
  ];

  const BC = ['#8d8f8a', '#a39f93', '#7d8087', '#9a9588', '#b09a82'];
  function panel(x, b, f, c0, sd, balc) { // 층고 2.7m(72px), 창 1.4x1.5m, 한 칸 3m(80px)
    const h = f * 72, y = G - h, w = b * 80 + 8;
    R(c0, x, y, w, h); R('rgba(0,0,0,.18)', x, y, w, 4);
    for (let c = 1; c < b; c++) R('rgba(0,0,0,.08)', x + 4 + c * 80, y, 1, h);
    for (let r = 0; r < f; r++) {
      const fy = G - (r + 1) * 72; R('rgba(0,0,0,.1)', x, fy, w, 2);
      for (let c = 0; c < b; c++) {
        const wx = x + 4 + c * 80 + 22, q = hs(sd, r, c);
        if (r === 0 && c === 1) { R('#555', wx - 4, G - 62, 44, 3); R('#3a3028', wx + 4, G - 56, 28, 56); disc('#c9a24a', wx + 28, G - 28, 2); continue; }
        R('#e8e4d8', wx - 2, fy + 12, 40, 44); R(q % 4 === 0 ? '#e6c36a' : '#2b3640', wx, fy + 14, 36, 40);
        if (q % 3 === 0) R(['#a84a4a', '#4a7a5a', '#c9a24a'][q % 2 + q % 3 % 2], wx, fy + 14, 12, 40);
        R('rgba(0,0,0,.35)', wx + 17, fy + 14, 2, 40);
        if (balc && c % 2 === 1 && r > 0) { R('#555', wx - 8, fy + 56, 52, 2); for (let k = 0; k < 6; k++) R('rgba(0,0,0,.4)', wx - 6 + k * 9, fy + 48, 1, 8); if (q % 3 === 1) R('#cfd8dc', wx + 6, fy + 36, 12, 12); }
      }
    }
    R('#555', x + w * .3, y - 18, 2, 18); R('#555', x + w * .3 - 6, y - 14, 14, 2); R('#555', x + w * .6, y - 12, 2, 12); R('#555', x + w * .6 - 5, y - 9, 12, 2);
  }
  const blockDefs = [
    { w: v => (3 + v % 3) * 80 + 8, weight: 4, draw: (x, v) => panel(x, 3 + v % 3, 3 + (v >> 3) % 3, BC[(v >> 6) % 5], v % 113, (v >> 9) % 2 === 0) },
    { w: 248, weight: 1, cool: 3, draw: (x, v) => panel(x, 3, 9, BC[(v >> 6) % 5], v % 113, true) },
    { w: 440, weight: 1, cool: 4, draw: (x, v) => { // 스탈린식 건물 (층고 3m)
        const f = 5 + v % 2, fh = 80, h = f * fh, y = G - h, w = 440;
        R('#c9b48a', x, y, w, h); R('#a8905a', x, y, w, 10); R('#8a7448', x, y + 10, w, 4);
        for (let c = 0; c < 6; c++) {
          R('#d8c9a0', x + 8 + c * 72, y + 14, 6, h - 14);
          for (let r = 0; r < f; r++) {
            const fy = G - (r + 1) * fh, wx = x + 22 + c * 72; if (r === 0 && c === 2) continue;
            R('#e8e4d8', wx - 2, fy + 12, 34, 52); R(hs(v % 97, r, c) % 4 === 0 ? '#e6c36a' : '#2b3640', wx, fy + 14, 30, 48);
          } }
        R('#1c1c20', x + 160, G - 70, 40, 70); ctx.fillStyle = '#1c1c20'; ctx.beginPath(); ctx.arc(x + 180, G - 70, 20, Math.PI, 0); ctx.fill(); } },
    { w: 330, weight: 1.5, cool: 2, draw: (x, v) => { // 차고 단지
        for (let i = 0; i < 4; i++) { const c = ['#6a7f9a', '#8a6a44', '#6f8a6a', '#a8403a'][(v + i) % 4], gx = x + i * 82;
          R(c, gx, G - 56, 80, 56); R('rgba(0,0,0,.25)', gx + 8, G - 46, 64, 46); R('#555', gx - 2, G - 60, 84, 5); } } },
  ];

  function streetBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, G);
    g.addColorStop(0, '#8e989e'); g.addColorStop(1, '#cfcbbd');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, G);
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    for (let i = 0; i < 5; i++) { const x = mod(i * 260 - camX * .08, W + 400) - 200; ctx.beginPath(); ctx.ellipse(x, 50 + (i * 31) % 70, 130, 22, 0, 0, 7); ctx.fill(); }
  }
  function streetGround() {
    R('#3b3d40', 0, G, W, GROUND_H); R('#7b7a76', 0, G, W, 16); R('#5c5b58', 0, G + 16, W, 4);
    rep(48, 1, 0, x => R('rgba(0,0,0,.2)', x, G, 2, 16));
    rep(90, 1, 0, x => R('#c9c4a8', x, G + 52, 50, 4));
  }
  const streetFloor = [
    { w: 50, weight: 2, cool: 2, draw: (x, v) => { // 자작나무 (약 6~8m)
        const h = 150 + v % 60, t = x + 20;
        R('#e4e0d4', t, G - h, 6, h); for (let i = 0; i < 6; i++) R('#2a2a2a', t, G - 30 - i * 24, 6, 2);
        ctx.strokeStyle = '#5a4a3a'; ctx.lineWidth = 2; ctx.beginPath();
        for (let i = 0; i < 6; i++) { const y = G - h + 20 + i * 18, d = i % 2 ? 1 : -1; ctx.moveTo(t + 3, y); ctx.lineTo(t + 3 + d * (22 - i * 2), y - 16); } ctx.stroke();
        ctx.fillStyle = ['rgba(176,138,58,.5)', 'rgba(143,154,74,.5)', 'rgba(168,104,58,.5)'][v % 3];
        for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(t + 3 + (i % 2 ? 16 : -16), G - h + 10 + i * 12, 14, 6, 0, 0, 7); ctx.fill(); } } },
    { w: 16, weight: 1.5, draw: x => { R('#3a3c3e', x, G - 24, 14, 24); R('#222', x - 1, G - 25, 16, 3); } },
    { w: 100, weight: 2, cool: 3, draw: (x, v) => { // 매점 2.5m x 2.4m
        const nm = ['ПИВО', 'ЦВЕТЫ', 'ГАЗЕТЫ', 'ПРОДУКТЫ'][v % 4], bc = ['#3d6b8c', '#6f8a6a', '#8a4a40', '#6a6a7a'][(v >> 2) % 4];
        R(bc, x, G - 64, 66, 64); R('#d9b43c', x - 4, G - 70, 74, 6); R('#e8e2cf', x + 8, G - 46, 50, 18); R('#6b4a30', x + 8, G - 28, 50, 3);
        text(nm, x + 8, G - 51, nm.length > 5 ? 8 : 10, '#f2f2f2');
        R('#a8855a', x + 70, G - 16, 16, 16); if (v % 2) R('#8a6a44', x + 74, G - 32, 14, 16); } },
    { w: 30, weight: 1, cool: 4, draw: x => { R('#b83a2e', x, G - 61, 28, 61); R('#a9c3c8', x + 4, G - 52, 20, 36); R('#222', x + 4, G - 12, 20, 3); R('#e8e2cf', x + 8, G - 57, 12, 3); } },
    { w: 112, weight: 2.5, cool: 2, draw: (x, v) => { // 승용차 4.1m
        const c = ['#8a8f7a', '#6a7f9a', '#a8403a', '#c9c4a8', '#5a6a4a'][v % 5];
        R(c, x, G - 24, 109, 19); poly(c, [[x + 22, G - 24], [x + 34, G - 37], [x + 82, G - 37], [x + 96, G - 24]]);
        poly('#9fb1b8', [[x + 27, G - 25], [x + 36, G - 34], [x + 56, G - 34], [x + 56, G - 25]]); poly('#9fb1b8', [[x + 60, G - 25], [x + 60, G - 34], [x + 80, G - 34], [x + 91, G - 25]]);
        R('#333', x - 2, G - 10, 113, 4); R('#e6c36a', x + 104, G - 20, 5, 4);
        disc('#1c1c1c', x + 22, G - 8, 8); disc('#1c1c1c', x + 88, G - 8, 8); disc('#777', x + 22, G - 8, 3); disc('#777', x + 88, G - 8, 3); } },
    { w: 150, weight: 1, cool: 6, draw: x => { // 버스 정류장
        R('#555', x, G - 67, 3, 67); R('#555', x + 107, G - 67, 3, 67); R('#444', x - 4, G - 70, 118, 4); R('rgba(170,190,195,.35)', x + 3, G - 64, 104, 50);
        R('#6b4a30', x + 20, G - 12, 60, 3); R('#3a281d', x + 24, G - 9, 3, 9); R('#3a281d', x + 72, G - 9, 3, 9);
        R('#555', x + 122, G - 80, 2, 80); R('#2f5f8f', x + 114, G - 96, 18, 18); text('А', x + 119, G - 82, 13, '#fff'); } },
    { w: 84, weight: 1.5, cool: 3, draw: (x, v) => { // 광고판
        const ad = ['ПЕЛЬМЕНИ', 'ЖВАЧКА', 'БАНК', 'ПИВО'][v % 4], bg = ['#c0392b', '#2f5f8f', '#3f7d5a', '#a8803a'][(v >> 2) % 4];
        R('#444', x + 8, G - 80, 3, 80); R('#444', x + 69, G - 80, 3, 80); R('#222', x, G - 134, 80, 56); R(bg, x + 3, G - 131, 74, 50); text(ad, x + 8, G - 104, 12, '#f5d76e'); } },
    { w: 56, weight: 2, draw: x => { R('#6b4a30', x, G - 12, 54, 3); R('#6b4a30', x, G - 24, 54, 3); R('#3a281d', x + 3, G - 24, 3, 24); R('#3a281d', x + 48, G - 24, 3, 24); } },
    { w: 100, weight: 1.5, cool: 2, draw: x => { // 울타리 1.2m
        R('#6b4a30', x, G - 28, 100, 3); R('#6b4a30', x, G - 14, 100, 3); for (let i = 0; i < 6; i++) R('#7a5a3a', x + 2 + i * 18, G - 32, 5, 32); } },
    { w: 56, weight: 1, cool: 3, draw: (x, v) => { // 화단
        R('#7a7a76', x, G - 16, 54, 16); R('#4a3a2a', x + 2, G - 18, 50, 4);
        for (let i = 0; i < 6; i++) disc(['#c0392b', '#e6c36a', '#e8e2cf'][(v + i) % 3], x + 6 + i * 8, G - 22 - (i % 2) * 4, 3); } },
    { w: 52, weight: 1, cool: 4, draw: x => { // 쓰레기 컨테이너 1.2m
        R('#3f6a4a', x, G - 30, 48, 30); R('#2f5238', x - 2, G - 34, 52, 5); R('rgba(0,0,0,.25)', x + 4, G - 24, 40, 2); disc('#222', x + 8, G - 3, 3); disc('#222', x + 40, G - 3, 3); } },
    { w: 40, weight: 1, cool: 4, draw: x => { // 자전거
        ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x + 8, G - 9, 8, 0, 7); ctx.arc(x + 32, G - 9, 8, 0, 7);
        ctx.moveTo(x + 8, G - 9); ctx.lineTo(x + 18, G - 20); ctx.lineTo(x + 32, G - 9); ctx.moveTo(x + 18, G - 20); ctx.lineTo(x + 28, G - 22); ctx.stroke(); } },
  ];
  const lampDef = { w: 30, draw: x => { R('#2f3336', x, G - 150, 3, 150); R('#2f3336', x, G - 150, 24, 3); R('#cfc9a8', x + 18, G - 148, 14, 5); R('#2f3336', x - 3, G - 10, 9, 10); } };

  // =====================================================
  // 장면 2: 카페 (아파트 1층, 층고 3.2m)
  // =====================================================
  const CAFE_C = G - m(3.2);
  function cafeBackground() {
    const C = CAFE_C;
    R('#26272a', 0, 0, W, C - 22); R('#3a3b3d', 0, C - 22, W, 14); R('#d8d0b8', 0, C - 8, W, 8);
    R('#7a5a45', 0, C + 5, W, G - C - 5);
    rep(24, 1, 0, x => R('rgba(0,0,0,.07)', x, C + 5, 12, G - C - 5));
    R('#b9ad8c', 0, C, W, 5); R('rgba(0,0,0,.18)', 0, C + 5, W, 2);
    R('#2f4a3a', 0, G - m(1), W, m(1)); R('#c9c4a8', 0, G - m(1), W, 2);
  }
  const cafeWall = [
    { w: 52, weight: 3, cool: 1, draw: (x, v) => {
        const wh = m(1.3), y = G - m(.9) - wh, cc = ['#8a2f2f', '#2f4a6a', '#6a5a2a', '#4a6a3a'][v % 4];
        R('#2d1f16', x - 3, y - 3, 46, wh + 6); R('#aab4b8', x, y, 40, wh);

      for (const it of q.items) {
        if (it.x > ex + VIS_R) break;
        if (it.x + it.w < ex - VIS_R || skipItem(q, it)) continue;
        if (!it.occ) measure(it);
        out.push(...it.occ);
      }
    });
    return out;
  }
  function spots(ex) { // 숨을 수 있는 가구 목록: { x0, x1 }
    const out = [];
    streams.forEach(q => {
      if (!q.occlude) return;
      for (const it of q.items) {
        if (it.x > ex + VIS_R) break;
        if (it.x + it.w < ex - VIS_R || !it.d.hide || skipItem(q, it)) continue;
        if (!it.occ) measure(it);
        if (!it.occ.length) continue;
        const x0 = Math.min(...it.occ.map(r => r.x0)), x1 = Math.max(...it.occ.map(r => r.x1)), top = Math.min(...it.occ.map(r => r.y0));
        if (G - top >= HIDE.minH && x1 - x0 >= 14) out.push({ x0, x1 });
      }
    });
    return out;
  }
  function spotFor(a) { // a 바로 옆(reach px 이내)에 있는 숨을 수 있는 가구. side: 1 = 가구가 내 오른쪽, -1 = 왼쪽
    let best = null, bd = HIDE.reach + 1;
    spots(a.wx + a.w / 2).forEach(sp => {
      const dr = Math.abs(a.wx + a.w - sp.x0), dl = Math.abs(a.wx - sp.x1);
      if (dr < bd) { bd = dr; best = { sp, side: 1 }; }
      if (dl < bd) { bd = dl; best = { sp, side: -1 }; }
    });
    return best;
  }
  function startHide(a, f) { a.hiding = true; a.side = f.side; a.face = f.side; a.wx = f.side > 0 ? f.sp.x0 - HIDE.w - 1 : f.sp.x1 + 1; }
  function stopHide(a) { a.hiding = false; }
  // 관찰자 obs{x,y}가 숨은 a를 볼 수 있는가: 가구 반대쪽 바깥 가장자리 세 점 중 하나라도 시선이 열려 있으면 보임
  function seenFrom(obs, a, rects) {
    const r = hurt(a), x = a.side > 0 ? r.wx : r.wx + r.w;
    return [r.y + 3, r.y + r.h / 2, r.y + r.h - 3].some(y => !rects.some(q => segHitsRect(obs.x, obs.y, x, y, q)));
  }
  function toggleHide() {
    if (!hideBtnActive()) return;
    if (player.hiding) { stopHide(player); return; }
    if (!player.onGround) return;
    const f = spotFor(player); if (f) startHide(player, f);
  }
  function updateHide() {
    if (!hideBtnActive()) { player.hiding = false; hideRects = []; nearSpot = null; return; }
    hideRects = occluders(eyeOf(player).x);
    nearSpot = player.hiding ? null : spotFor(player);
    player.exposed = player.hiding && npcs.some(b => !b.dead && Math.abs(b.wx - player.wx) < HIDE.vision && seenFrom(eyeOf(b), player, hideRects));
  }
  // --- 다른 플레이어(npcs): 돌아다니다가 가끔 가구 옆에 숨고, 열차에 닿으면 사라짐 ---
  function spawnBots() {
    return [0, 1, 2].map(i => ({ wx: 350 + i * 330 + Math.random() * 120, y: G - 48, w: 18, h: 48, face: 1, col: BOT_COLS[i], hiding: false, side: 1, dead: false, st: 'wander', t: Math.random() * 2, dir: Math.random() < .5 ? -1 : 1 }));
  }
  function updateBots(dt) {
    npcs.forEach(b => {
      if (b.dead) return;
      b.t -= dt;
      if (b.st === 'wander') {
        b.wx = Math.max(0, b.wx + b.dir * 55 * dt); b.face = b.dir;
        if (b.t <= 0) {
          b.t = 3 + Math.random() * 4; b.dir = Math.random() < .5 ? -1 : 1;
          if (Math.random() < .4) {
            const list = spots(b.wx).filter(sp => sp.x0 > 40 && Math.abs(sp.x0 - b.wx) < 420);
            if (list.length) { const sp = list[Math.floor(Math.random() * list.length)], side = Math.random() < .5 ? 1 : -1; b.goal = { side, x: side > 0 ? sp.x0 - HIDE.w - 1 : sp.x1 + 1 }; b.st = 'goto'; }
          }
        }
      } else if (b.st === 'goto') {
        const dx = b.goal.x - b.wx, step = 95 * dt; b.face = Math.sign(dx) || 1;
        if (Math.abs(dx) <= step) { b.wx = b.goal.x; b.hiding = true; b.side = b.goal.side; b.face = b.side; b.st = 'hide'; b.t = 3 + Math.random() * 4; }
        else b.wx += Math.sign(dx) * step;
      } else if (b.t <= 0) { b.hiding = false; b.st = 'wander'; b.t = 1 + Math.random() * 2; b.dir = -b.side; }
      if (scene.hazard && scene.hazard.hits(hurt(b))) b.dead = true; // 열차에 닿으면 탈락
    });
  }
  function drawActor(a, col, alpha) {
    const r = hurt(a), px = r.wx - camX, k = r.h / 48;
    ctx.globalAlpha = alpha; R(col, px, r.y, r.w, r.h);
    const ex = a.face === 1 ? px + r.w - 7 : px + 3;
    R('#fff', ex, r.y + 8 * k, 4, 4); R('#111', a.face === 1 ? ex + 2 : ex, r.y + 9 * k, 2, 2);
    ctx.globalAlpha = 1;
  }
  function drawBots() { // 숨은 봇은 내 시점에서 그림자에 가려지면 안 보이고, 시선이 열려 있으면 살짝 투명하게 보임
    const eye = eyeOf(player);
    npcs.forEach(b => {
      if (b.dead) return;
      if (!b.hiding) { drawActor(b, b.col, 1); return; }
      if (seenFrom(eye, b, hideRects)) drawActor(b, b.col, .6);
    });
  }

  // ---------- 플레이어 (180cm = 48px) ----------
  function drawPlayer() {
    drawActor(player, '#e8453c', player.hiding ? (player.exposed ? .6 : .35) : 1); // 숨는 중: 보이는 각이면 60%, 완전히 가려지면 내 눈에만 35%
  }

  // ---------- 입력 ----------
  const JOY_R = 50;
  const joy = { active: false, id: null, bx: W - 110, by: H - 100, sx: W - 110, sy: H - 100, dx: 0 };
  const jbtn = { x: 100, y: H - 90, r: 42, down: false, id: null };
  const hbtn = { x: 200, y: H - 90, r: 36 }; // 숨기 버튼
  const keys = {};
  function jump() { if (player.hiding) { stopHide(player); return; } if (player.onGround) { player.vy = -JUMP_V; player.onGround = false; } }
  addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === 'e' || e.key === 'h') toggleHide();
    if (phase === 'vote' && /^[1-9]$/.test(e.key) && +e.key <= SCENES.length) myVote = +e.key - 1;
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); jump(); }
  });
  addEventListener('keyup', e => { keys[e.key] = false; });
  const toLogical = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
  function moveStick(p) {
    let vx = p.x - joy.bx, vy = p.y - joy.by; const len = Math.hypot(vx, vy);
    if (len > JOY_R) { vx = vx / len * JOY_R; vy = vy / len * JOY_R; }
    joy.sx = joy.bx + vx; joy.sy = joy.by + vy; joy.dx = vx / JOY_R;
  }
  function resetStick() { joy.active = false; joy.id = null; joy.dx = 0; joy.bx = W - 110; joy.by = H - 100; joy.sx = joy.bx; joy.sy = joy.by; }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); const p = toLogical(e);
    if (phase === 'vote' && tapVote(p)) return;
    if (hideBtnActive() && Math.hypot(p.x - hbtn.x, p.y - hbtn.y) < hbtn.r + 8) { toggleHide(); return; }
    if (p.x < W * 0.5) { jbtn.down = true; jbtn.id = e.pointerId; jump(); return; }
    if (joy.active) return;
    joy.active = true; joy.id = e.pointerId; joy.bx = p.x; joy.by = p.y; cv.setPointerCapture(e.pointerId); moveStick(p);
  });
  cv.addEventListener('pointermove', e => { if (joy.active && e.pointerId === joy.id) moveStick(toLogical(e)); });
  ['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, e => {
    if (e.pointerId === joy.id) resetStick();
    if (e.pointerId === jbtn.id) { jbtn.down = false; jbtn.id = null; }
  }));
  function drawControls() {
    ctx.globalAlpha = joy.active ? .55 : .25; disc('#fff', joy.bx, joy.by, JOY_R);
    ctx.globalAlpha = joy.active ? .9 : .4; disc('#333', joy.sx, joy.sy, 22);
    ctx.globalAlpha = jbtn.down ? .6 : .3; disc('#fff', jbtn.x, jbtn.y, jbtn.r);
    ctx.globalAlpha = .75; ctx.textAlign = 'center'; text('점프', jbtn.x, jbtn.y + 6, 16, '#222'); ctx.textAlign = 'left';
    if (hideBtnActive()) { // 숨기 버튼: 숨을 수 있는 가구 옆이면 진하게
      ctx.globalAlpha = player.hiding ? .65 : nearSpot ? .55 : .2; disc(player.hiding ? '#9ec8e6' : '#fff', hbtn.x, hbtn.y, hbtn.r);
      ctx.globalAlpha = .85; ctx.textAlign = 'center'; text(player.hiding ? '해제' : '숨기', hbtn.x, hbtn.y + 5, 14, '#222'); ctx.textAlign = 'left';
    }
    ctx.globalAlpha = 1;
  }

  // ---------- 루프 ----------
  let last = performance.now();
  function loop(t) {
    const dt = Math.min((t - last) / 1000, 0.05); last = t;
    updateFlow(dt); fade = Math.max(0, fade - dt * 2.5); msgT = Math.max(0, msgT - dt);
    scareT = Math.max(0, scareT - dt);
    let d = Math.abs(joy.dx) > 0.15 ? joy.dx : 0;
    if (keys['ArrowRight'] || keys['d']) d = 1;
    if (keys['ArrowLeft'] || keys['a']) d = -1;
    if (player.hiding) { if (Math.abs(d) > .6) stopHide(player); else d = 0; } // 숨는 중에는 제자리 (세게 밀면 해제)
    if (d !== 0) player.face = d > 0 ? 1 : -1;
    player.wx = Math.max(0, player.wx + d * SPEED * dt);
    camX = Math.max(0, player.wx - CAM_LEAD);
    if (phase === 'match' && !dead && scene.hazard) { scene.hazard.update(dt); if (scene.hazard.hits()) kill('열차에 치였습니다'); }
    if (phase === 'match') updateBots(dt);
    updateHide();

    player.vy += GRAVITY * dt; player.y += player.vy * dt;
    const floor = GROUND_Y - player.h;
    if (player.y >= floor) { player.y = floor; player.vy = 0; player.onGround = true; }

    ctx.save(); ctx.scale(ZOOM, ZOOM); ctx.translate(0, -CAM_TOP);
    scene.background(); streams.forEach(q => { if (!q.late) drawStream(q); }); scene.ground();
    streams.forEach(q => { if (q.late) drawStream(q); }); // late: 바닥 위에 그려야 하는 것(선로 등)
    drawBots();
    drawVision();
    if (scene.hazard) scene.hazard.draw(false);
    drawPlayer();
    if (scene.hazard) scene.hazard.draw(true);
    ctx.restore();
    if (fade > 0) R(`rgba(0,0,0,${fade})`, 0, 0, W, H);
    if (scene.hazard && !dead) scene.hazard.overlay();
    drawControls(); drawHUD();
    drawScare();
    ctx.font = '14px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fillText('Москва, 1998 - ' + scene.name, 14, 24);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
